name: test-minikube-script
on:
  push:
    branches:
      - '**'
      - '!deploy/**'
  schedule:
    - cron: '0 4 5,25 * *'


jobs:
  test-minikube-script:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chart:
          - minikube_tests/charts/argo-workflows-0.45.6-Chart.yaml
          - minikube_tests/charts/argo-workflows-0.33.1-Chart.yaml
    steps:
      - uses: actions/checkout@v4

      - name: start Minikube
        id: minikube
        uses: medyagh/setup-minikube@v0.0.19
        with:
          addons: ingress,ingress-dns

      - name: Try the cluster
        run: kubectl get pods -A

      - name: Run setup-tests.sh
        shell: bash -l {0}
        run: |
          chmod +x ./minikube_tests/setup-tests.sh 
          ./minikube_tests/setup-tests.sh -f values/values-deploy-minikube.yaml -d -n -u -p -v -c "${{ matrix.chart }}"

      - name: Verify NaaVRE workflow service is started
        run: |
          set -euo pipefail
          NAMESPACE="naavre"
          WORKFLOW_DEPLOYMENT="$(kubectl get deployments -n "$NAMESPACE" -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | grep 'naavre-workflow-service' | head -n1)"

          if [ -z "$WORKFLOW_DEPLOYMENT" ]; then
            echo "Could not find a deployment matching 'naavre-workflow-service' in namespace '$NAMESPACE'."
            kubectl get deployments -n "$NAMESPACE"
            exit 1
          fi

          kubectl rollout status "deployment/$WORKFLOW_DEPLOYMENT" -n "$NAMESPACE" --timeout=300s
          kubectl wait --for=condition=ready "pod" -l "app.kubernetes.io/instance=naavre,app.kubernetes.io/component=naavre-workflow-service" -n "$NAMESPACE" --timeout=300s

      - name: Verify NaaVRE containerizer service is started
        run: |
          set -euo pipefail
          NAMESPACE="naavre"
          CONTAINERIZER_DEPLOYMENT="$(kubectl get deployments -n "$NAMESPACE" -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | grep 'naavre-containerizer-service' | head -n1)"

          if [ -z "$CONTAINERIZER_DEPLOYMENT" ]; then
            echo "Could not find a deployment matching 'naavre-containerizer-service' in namespace '$NAMESPACE'."
            kubectl get deployments -n "$NAMESPACE"
            exit 1
          fi

          kubectl rollout status "deployment/$CONTAINERIZER_DEPLOYMENT" -n "$NAMESPACE" --timeout=300s
          kubectl wait --for=condition=ready "pod" -l "app.kubernetes.io/instance=naavre,app.kubernetes.io/component=naavre-containerizer-service" -n "$NAMESPACE" --timeout=300s

      - name: Test auth token with python jwt library
        run: |
          pip install pyjwt
          python -c "import jwt; import os; token = os.getenv('AUTH_TOKEN'); decoded = jwt.decode(token, options={'verify_signature': False}); print(decoded)"

      - name: Run playwright tests
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: |
          cd tests
          npm ci

      - name: Install Playwright Browsers
        run: |
          cd tests
          npx playwright install --with-deps

      - name: Run Playwright tests
        run: |
          cd tests
          npx playwright test

      - name: Create folder for "${{ matrix.chart }}"
        run: mkdir -p tests/playwright-report/${{ matrix.chart }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: tests/playwright-report/${{ matrix.chart }}
          retention-days: 5
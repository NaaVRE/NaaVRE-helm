version: 2

updates:
  - package-ecosystem: "helm"
    directory: "/naavre"
    allow:
      - dependency-name: seaweedfs
    schedule:
      interval: "weekly"
    registries:
      - seaweedfs-repo

# 2. Define the authentication details for your private registries
registries:
  seaweedfs-repo:
    type: helm-registry
    url: https://seaweedfs.github.io/seaweedfs/helm
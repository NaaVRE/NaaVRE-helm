name: test-minikube-script
on:
  push:
    branches:
      - '**'
      - '!deploy/**'
  schedule:
    - cron: '0 4 5,25 * *'


jobs:
  test-minikube-script:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        chart:
          - minikube_tests/charts/argo-workflows-0.45.6-Chart.yaml
          - minikube_tests/charts/argo-workflows-0.33.1-Chart.yaml
    steps:
      - uses: actions/checkout@v7

      - name: start Minikube
        id: minikube
        uses: medyagh/setup-minikube@v0.0.19
        with:
          addons: ingress,ingress-dns

      - name: Try the cluster
        run: kubectl get pods -A

      - name: Run setup-tests.sh
        shell: bash -l {0}
        run: |
          chmod +x ./minikube_tests/setup-tests.sh 
          ./minikube_tests/setup-tests.sh -f values/values-deploy-minikube-all.yaml -d -n -u -p -v -c "${{ matrix.chart }}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Test auth token with python jwt library
        run: |
          python -m pip install pyjwt
          python -c "import jwt; import os; token = os.getenv('AUTH_TOKEN'); decoded = jwt.decode(token, options={'verify_signature': False}); print(decoded)"

      - name: Install Python e2e test dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Python e2e tests
        run: python -m pytest tests/e2e/e2e-test.py --browser chromium

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: tests/playwright-report/${{ matrix.chart }}
          retention-days: 5
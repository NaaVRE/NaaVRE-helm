version: 2

updates:
  - package-ecosystem: "helm"
    directory: "/naavre"
    schedule:
      interval: "weekly"
    registries:
      - my-private-helm-repo

# 2. Define the authentication details for your private registries
registries:
  my-private-helm-repo:
    type: helm-registry
    url: https://charts.example.com/
    username: ${{ secrets.HELM_REGISTRY_USERNAME }}
    password: ${{ secrets.HELM_REGISTRY_PASSWORD }}
name: test-minikube-script
on:
  push:
    branches:
      - '**'
      - '!deploy/**'
  schedule:
    - cron: '0 4 5,25 * *'


jobs:
  test-minikube-script:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chart:
          - minikube_tests/charts/argo-workflows-0.45.6-Chart.yaml
          - minikube_tests/charts/argo-workflows-0.33.1-Chart.yaml
    steps:
      - uses: actions/checkout@v4

      - name: start Minikube
        id: minikube
        uses: medyagh/setup-minikube@v0.0.19
        with:
          addons: ingress,ingress-dns

      - name: Try the cluster
        run: kubectl get pods -A

      - name: Run setup-tests.sh
        shell: bash -l {0}
        run: |
          chmod +x ./minikube_tests/setup-tests.sh 
          ./minikube_tests/setup-tests.sh -f values/values-deploy-minikube.yaml -d -n -u -p -v -c "${{ matrix.chart }}"

      - name: Verify NaaVRE services are started
        run: |
          set -euo pipefail
          NAMESPACE="naavre"
          SERVICES=(
            "naavre-naavre-catalogue-service"
            "naavre-naavre-containerizer-service"
            "naavre-naavre-workflow-service"
            "naavre-k8s-secret-creator"
          )
          for SERVICE in "${SERVICES[@]}"; do
            if ! kubectl wait --for=condition=ready pod -l "app.kubernetes.io/name=$SERVICE" -n "$NAMESPACE" --timeout=600s; then
              echo "Pods for '$SERVICE' did not become ready in namespace '$NAMESPACE'."
              exit 1
            fi
          done

      - name: Test auth token with python jwt library
        run: |
          pip install pyjwt
          python -c "import jwt; import os; token = os.getenv('AUTH_TOKEN'); decoded = jwt.decode(token, options={'verify_signature': False}); print(decoded)"

      - name: Run playwright tests
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: |
          cd tests
          npm ci

      - name: Install Playwright Browsers
        run: |
          cd tests
          npx playwright install --with-deps

      - name: Run Playwright tests
        run: |
          cd tests
          npx playwright test

      - name: Create folder for "${{ matrix.chart }}"
        run: mkdir -p tests/playwright-report/${{ matrix.chart }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: tests/playwright-report/${{ matrix.chart }}
          retention-days: 5
version: 2
registries:
  naavre-oci:
    type: "docker-registry"
    url: "oci://ghcr.io/naavre/charts"

updates:
  - package-ecosystem: "helm"
    directory: "/naavre"
    registries:
      - "naavre-oci"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
